<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Football favicon, hand-authored so there is no third-party asset or licence
    to track. On-brand: Sleeper's base navy plate with the signature teal.

    Geometry: the ball is a lens (two arcs on a common chord) rotated 45deg.
    Chord runs (5,27)->(27,5), length ~31.1. Arc radius 18 gives a sagitta of
    ~8.9, so the ball is ~31 long by ~18 wide — a 1.74:1 ratio, which is about
    right for a real football. Smaller radii read as a rugby ball, larger as a
    lemon.

    The laces are cut in the plate colour rather than drawn in white so the
    mark stays legible when a browser shrinks it to 16px.
  -->
  <rect width="32" height="32" rx="7" fill="#18202f"/>

  <g transform="translate(0.5 0.5) scale(0.94) translate(1 1)">
    <path d="M5 27A18 18 0 0 1 27 5A18 18 0 0 1 5 27Z" fill="#00ceb8"/>

    <g stroke="#18202f" stroke-width="1.6" stroke-linecap="round">
      <!-- end stripes -->
      <path d="M7.2 21.2 10.8 24.8"/>
      <path d="M21.2 7.2 24.8 10.8"/>
      <!-- centre seam along the long axis -->
      <path d="M12.4 19.6 19.6 12.4"/>
      <!-- cross stitches, perpendicular to the seam -->
      <path d="M11.9 17.5 14.5 20.1"/>
      <path d="M13.8 15.6 16.4 18.2"/>
      <path d="M15.6 13.8 18.2 16.4"/>
      <path d="M17.5 11.9 20.1 14.5"/>
    </g>
  </g>
</svg>
